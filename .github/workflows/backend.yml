name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Stop Backend App Pool
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "AquaticFishECommercePool"

      - name: Publish
        run: dotnet publish .\src\AquaticFishECommerce.API\AquaticFishECommerce.API.csproj -c Release -o C:\inetpub\AquaticFishECommerce

      - name: Restart Backend App Pool
        run: |
            Import-Module WebAdministration
            Restart-WebAppPool -Name "AquaticFishECommercePool"
